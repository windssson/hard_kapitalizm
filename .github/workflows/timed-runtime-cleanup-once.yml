name: Timed Runtime Cleanup Once

on:
  push:
    branches: [feature/timed-runtime-cleanup]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: feature/timed-runtime-cleanup

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Normalize deterministic cleanup targets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('lib/features/logistics/ui/logistics_management_screen.dart')
          text = source.read_text(encoding='utf-8')
          old = '''class _ConstructionCountdown extends ConsumerStatefulWidget {
            final String constructionId;
            final DateTime finishAt;
            final Duration totalDuration;
            final VoidCallback? onFinish;

            const _ConstructionCountdown({
              required this.constructionId,
              required this.finishAt,
              required this.totalDuration,
              this.onFinish,
            });
          '''
          new = '''class _ConstructionCountdown extends ConsumerStatefulWidget {
            final DateTime finishAt;
            final Duration totalDuration;

            const _ConstructionCountdown({
              required this.finishAt,
              required this.totalDuration,
            });
          '''
          if text.count(old) != 1:
              raise SystemExit(f'Expected one logistics countdown class header, found {text.count(old)}')
          source.write_text(text.replace(old, new), encoding='utf-8')

          warehouse = Path('lib/features/warehouse/data/warehouse_provider.dart')
          text = warehouse.read_text(encoding='utf-8')
          call = '    await _tryCompleteDueWarehouseUpgrades(supabase);\n'
          if text.count(call) != 2:
              raise SystemExit(f'Expected exactly two warehouse due-upgrade read calls, found {text.count(call)}')
          text = text.replace(call, '')
          empty_try = '  try {\n  } catch (_) {}\n\n'
          if text.count(empty_try) != 1:
              raise SystemExit(f'Expected one empty warehouse detail try/catch after call removal, found {text.count(empty_try)}')
          warehouse.write_text(text.replace(empty_try, ''), encoding='utf-8')

          script = Path('tool/timed_runtime_cleanup.py')
          text = script.read_text(encoding='utf-8')
          obsolete = [
              'remove_line_exact(LOGISTICS_SCREEN, "  final String constructionId;\\n")\n',
              'remove_line_exact(LOGISTICS_SCREEN, "  final VoidCallback? onFinish;\\n")\n',
              'remove_line_exact(LOGISTICS_SCREEN, "    required this.constructionId,\\n")\n',
              'remove_line_exact(LOGISTICS_SCREEN, "    this.onFinish,\\n")\n',
          ]
          for line in obsolete:
              if text.count(line) != 1:
                  raise SystemExit(f'Expected one obsolete cleanup command: {line!r}')
              text = text.replace(line, '')

          old_pattern = '''        rf"(?m)^[ \\t]*(?:Future<[^\\n]+>|[A-Za-z_][A-Za-z0-9_<>,? ]*)\\s+{re.escape(name)}\\s*\\("
          '''
          new_pattern = '''        rf"(?m)^[ \\t]*Future<[^\\n]+>\\s+{re.escape(name)}\\s*\\("
          '''
          if text.count(old_pattern) != 1:
              raise SystemExit(f'Expected one broad function parser pattern, found {text.count(old_pattern)}')
          text = text.replace(old_pattern, new_pattern)

          start_marker = 'remove_line_exact(WAREHOUSE_PROVIDER, "    await _tryCompleteDueWarehouseUpgrades(supabase);\\n")\n'
          end_marker = 'for method in ("completeConstruction", "completeDueWarehouseUpgrades", "completeLogisticsTransfer"):'
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit('Could not isolate obsolete warehouse cleanup commands in script')
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          text = text[:start] + text[end:]

          old_count_guard = 'if runtime_due_count != 3:'
          if text.count(old_count_guard) != 1:
              raise SystemExit(f'Expected one brittle runtime count guard, found {text.count(old_count_guard)}')
          text = text.replace(old_count_guard, 'if runtime_due_count < 1:')
          script.write_text(text, encoding='utf-8')
          PY

      - name: Apply deterministic cleanup
        run: python3 tool/timed_runtime_cleanup.py

      - name: Fix verified cleanup fallout
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          store = Path('lib/features/store/ui/store_screen.dart')
          text = store.read_text(encoding='utf-8')
          marker = 'class _ConstructionCountdown extends ConsumerWidget {'
          if text.count(marker) != 1:
              raise SystemExit(f'Expected one store countdown class, found {text.count(marker)}')
          start = text.index(marker)
          prefix, countdown = text[:start], text[start:]
          expected = {'widget.finishAt': 2, 'widget.startedAt': 2}
          for token, count in expected.items():
              if countdown.count(token) != count:
                  raise SystemExit(f'Store countdown: expected {count} {token} refs, found {countdown.count(token)}')
          countdown = countdown.replace('widget.finishAt', 'finishAt')
          countdown = countdown.replace('widget.startedAt', 'startedAt')
          store.write_text(prefix + countdown, encoding='utf-8')

          arge = Path('lib/features/arge/ui/arge_screen.dart')
          text = arge.read_text(encoding='utf-8')
          stale = "    final centerId = centerAsync.value?.id ?? '';\n\n"
          if text.count(stale) != 1:
              raise SystemExit(f'Expected one stale AR-GE centerId local, found {text.count(stale)}')
          arge.write_text(text.replace(stale, ''), encoding='utf-8')

          guard_import = "import 'package:hard_kapitalizm/core/data/building_upgrade_guard_service.dart';\n"
          for rel in (
              'lib/features/factory/data/factory_provider.dart',
              'lib/features/farm/data/farm_provider.dart',
              'lib/features/field/data/field_provider.dart',
              'lib/features/mine/data/mine_provider.dart',
              'lib/features/store/data/store_provider.dart',
          ):
              path = Path(rel)
              text = path.read_text(encoding='utf-8')
              if text.count(guard_import) != 1:
                  raise SystemExit(f'{rel}: expected one now-unused guard import, found {text.count(guard_import)}')
              path.write_text(text.replace(guard_import, ''), encoding='utf-8')
          PY

      - name: Format changed Dart sources only
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff --name-only -- lib | grep -E '\.dart$' || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo 'No changed Dart files to format.'
            exit 1
          fi
          dart format "${files[@]}"

      - name: Prepare non-secret test environment
        run: cp .env.example .env

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze for compile errors
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Verify TimedTaskRuntime ownership
        shell: bash
        run: |
          set -euo pipefail
          forbidden='complete_building_construction|complete_arge_research|complete_logistics_transfer|complete_due_player_building_upgrades|complete_due_warehouse_upgrades|process_tender_deliveries|finish_building_boost|completeResearch\(|completeDueBuildingUpgrades\(|completeDueWarehouseUpgrades\(|completeConstruction\(|completeLogisticsTransfer\(|tryCompleteDueBuildingUpgrades\(|_tryCompleteDueWarehouseUpgrades\(|_handleConstructionFinished|_onCompleteCenterConstruction|_onCollect|onFinished:|onFinish:'
          if grep -RInE --include='*.dart' "$forbidden" lib; then
            echo 'Legacy timed-completion ownership violations remain.'
            exit 1
          fi

          runtime_file='lib/core/data/timed_task_runtime_service.dart'
          if ! grep -q 'complete_timed_task_runtime_due' "$runtime_file"; then
            echo 'TimedTaskRuntime aggregated completion RPC is missing.'
            exit 1
          fi

          while IFS= read -r path; do
            if [ -n "$path" ] && [ "$path" != "$runtime_file" ]; then
              echo "Aggregated runtime RPC leaked outside runtime service: $path"
              exit 1
            fi
          done < <(grep -RIl --include='*.dart' 'complete_timed_task_runtime_due' lib || true)

      - name: Commit verified source cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib
          if git diff --cached --quiet; then
            echo 'No source changes produced.'
            exit 1
          fi
          git commit -m 'Finish TimedTaskRuntime legacy cleanup'
          git push origin HEAD:feature/timed-runtime-cleanup
