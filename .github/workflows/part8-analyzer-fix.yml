name: Part 8 analyzer fix

on:
  push:
    branches: [feat/frontend-industrial-visible-part8]
    paths:
      - .github/workflows/part8-analyzer-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/frontend-industrial-visible-part8
          fetch-depth: 0

      - name: Apply analyzer fixes
        run: python tool/part8_fix_analyze.py

      - name: Remove temporary tooling
        run: rm -f tool/part8_fix_analyze.py .github/workflows/part8-analyzer-fix.yml

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix industrial detail analyzer issues"
          git push origin HEAD:feat/frontend-industrial-visible-part8
