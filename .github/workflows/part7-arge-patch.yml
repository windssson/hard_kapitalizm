name: Part 7 AR-GE source patch

on:
  push:
    branches: [feat/frontend-arge-logistics-part7]
    paths:
      - .github/workflows/part7-arge-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/frontend-arge-logistics-part7
          fetch-depth: 0

      - name: Apply AR-GE quote integration
        run: python tool/part7_patch_arge.py

      - name: Remove temporary patch tooling
        run: rm -f tool/part7_patch_arge.py .github/workflows/part7-arge-patch.yml

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate AR-GE construction and upgrade quotes"
          git push origin HEAD:feat/frontend-arge-logistics-part7
