name: Build factory slot fix APK

on:
  push:
    branches: [build/factory-slot-fix-apk-20260911]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create test environment
        shell: bash
        run: |
          cat > .env <<'EOF'
          SUPABASE_URL=https://lpiixtfxldhoyyppavyn.supabase.co
          SUPABASE_ANON_KEY=sb_publishable_iguC0UQeid86cxIIGrnmOw_70kcyfem
          ADMOB_ANDROID_REWARDED_ID=ca-app-pub-3940256099942544/5224354917
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build ARM64 debug APK
        run: flutter build apk --debug --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hard-kapitalizm-factory-slot-fix-arm64
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
