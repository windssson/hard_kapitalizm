name: Part 12 production UI unification

on:
  push:
    branches:
      - feat/unify-production-ui-part12

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/unify-production-ui-part12
          fetch-depth: 0

      - name: Unify Factory and Mine list/detail layout
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_function(text: str, needle: str, replacement: str) -> str:
              start = text.find(needle)
              if start < 0:
                  raise SystemExit(f'function not found: {needle}')
              brace = text.find('{', start)
              if brace < 0:
                  raise SystemExit(f'opening brace not found: {needle}')
              depth = 0
              i = brace
              while i < len(text):
                  c = text[i]
                  if c == '{':
                      depth += 1
                  elif c == '}':
                      depth -= 1
                      if depth == 0:
                          return text[:start] + replacement.rstrip() + '\n\n' + text[i+1:]
                  i += 1
              raise SystemExit(f'closing brace not found: {needle}')

          def delete_function(text: str, needle: str) -> str:
              return replace_function(text, needle, '')

          factory_path = Path('lib/features/factory/ui/factory_screen.dart')
          f = factory_path.read_text()
          import_line = "import 'package:hard_kapitalizm/core/models/production_slot_model.dart';\n"
          if import_line not in f:
              anchor = "import 'package:hard_kapitalizm/core/theme/app_theme.dart';\n"
              f = f.replace(anchor, import_line + anchor, 1)

          f = replace_function(f, '  Widget _buildStatsHeader(', r'''  Widget _buildStatsHeader(List<FactoryListItemModel> factories) {
            final activeCount = factories.where((item) => item.factory.isActive).length;
            final totalSlots = factories.fold<int>(
              0,
              (sum, item) => sum + item.factory.maxSlotCount,
            );
            final totalOutputStock = factories.fold<int>(
              0,
              (sum, item) => sum + item.outputStockQuantity,
            );

            return Container(
              width: double.infinity,
              padding: EdgeInsets.all(12.w),
              decoration: AppDecorations.premiumCard(null, 12.r),
              child: SingleChildScrollView(
                scrollDirection: Axis.horizontal,
                physics: const BouncingScrollPhysics(),
                child: Row(
                  children: [
                    _buildStatItem(
                      AppIcons.factory,
                      AppColors.gold,
                      'Fabrika',
                      factories.length.toString(),
                    ),
                    SizedBox(width: 14.w),
                    Container(width: 1, height: 30.h, color: AppColors.border),
                    SizedBox(width: 14.w),
                    _buildStatItem(
                      AppIcons.checkCircle,
                      AppColors.green,
                      'Aktif',
                      activeCount.toString(),
                    ),
                    SizedBox(width: 14.w),
                    Container(width: 1, height: 30.h, color: AppColors.border),
                    SizedBox(width: 14.w),
                    _buildStatItem(
                      AppIcons.layers,
                      AppColors.blue,
                      'Slot',
                      totalSlots.toString(),
                    ),
                    SizedBox(width: 14.w),
                    Container(width: 1, height: 30.h, color: AppColors.border),
                    SizedBox(width: 14.w),
                    _buildStatItem(
                      AppIcons.inventory2,
                      AppColors.gold,
                      'Ürün',
                      _formatCompact(totalOutputStock),
                    ),
                  ],
                ),
              ),
            );
          }''')

          f = replace_function(f, '  Widget _buildAdvancedFactoryCard(', r'''  Widget _buildAdvancedFactoryCard(FactoryListItemModel item) {
            final factory = item.factory;
