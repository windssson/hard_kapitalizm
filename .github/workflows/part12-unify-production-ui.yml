                                overflow: TextOverflow.ellipsis,
                                style: AppTextStyles.caption.standardCopyWith(
                                  color: AppColors.textSecondary,
                                  fontSize: AppTypography.label,
                                  fontWeight: FontWeight.w500,
                                ),
                              ),
                            ),
                          ],
                        ),
                      ),
                      SizedBox(width: 4.w),
                      Text(
                        '${_formatCompact(item.outputStockQuantity)} adet / ${_formatCompact(item.mine.outputCapacity)} adet',
                        style: AppTextStyles.caption.standardCopyWith(
                          color: ratio >= 0.6
                              ? AppColors.green
                              : (ratio <= 0.25
                                  ? AppColors.red
                                  : AppColors.textPrimary),
                          fontSize: AppTypography.label,
                          fontWeight: FontWeight.bold,
                        ),
                      ),
                    ],
                  ),
                  SizedBox(height: 6.h),
                  AppProgressBar.stock(value: ratio, size: AppProgressSize.compact),
                ],
              ),
            );
          }''')

          for name in [
              '  Widget _buildProductSection(',
              '  Widget _buildMineSlotPreview(',
              '  Widget _buildLegacyMineProduct(',
          ]:
              if name in m:
                  m = delete_function(m, name)

          mine_slots = r'''  Widget _buildSlotsSection(MineListItemModel item) {
            final mine = item.mine;

            ProductionSlotContractModel? slotAt(int slotIndex) {
              for (final slot in item.productionSlots) {
                if (slot.slotIndex == slotIndex) return slot;
              }
              return null;
            }

            return Container(
              padding: EdgeInsets.all(12.w),
              decoration: BoxDecoration(
                color: AppFx.panelWash(0.2),
                borderRadius: BorderRadius.circular(14.r),
                border: Border.all(
                  color: AppColors.borderGold.withValues(alpha: 0.15),
                ),
              ),
              child: Column(
                crossAxisAlignment: CrossAxisAlignment.start,
                children: [
                  Row(
                    mainAxisAlignment: MainAxisAlignment.spaceBetween,
                    children: [
                      Text(
                        'Üretim Slotları',
                        style: AppTextStyles.caption.standardCopyWith(
                          color: AppColors.textSecondary,
                          fontSize: AppTypography.bodySmall,
                          fontWeight: FontWeight.w600,
                        ),
                      ),
                      _buildSmallBadge(
                        '${mine.currentSlotCount} / ${mine.maxSlotCount} Açık',
                        AppColors.gold,
                      ),
                    ],
                  ),
                  SizedBox(height: 12.h),
                  Wrap(
                    spacing: 10.w,
                    runSpacing: 10.h,
                    children: List.generate(
                      mine.maxSlotCount,
                      (index) => _buildMineSlotIcon(
                        index: index,
                        unlockedCount: mine.currentSlotCount,
                        slot: slotAt(index + 1),
                      ),
                    ),
                  ),
                ],
              ),
            );
          }

          Widget _buildMineSlotIcon({
            required int index,
            required int unlockedCount,
            required ProductionSlotContractModel? slot,
          }) {
            final isLocked = index >= unlockedCount;
            final hasProduct = slot?.isConfigured == true && slot?.product != null;
            final isActive = slot?.isActive == true;

            return Container(
              width: 48.w,
              height: 48.w,
              padding: EdgeInsets.all(hasProduct ? 4.w : 0),
              decoration: BoxDecoration(
                color: isLocked
                    ? AppFx.panelWash(0.3)
                    : AppColors.cardBgLight.withValues(alpha: 0.4),
                borderRadius: BorderRadius.circular(12.r),
                border: Border.all(
                  color: isLocked
                      ? AppFx.softOverlay(0.04)
                      : hasProduct
                          ? (isActive
                              ? AppColors.green.withValues(alpha: 0.4)
                              : AppColors.textMuted.withValues(alpha: 0.3))
                          : AppColors.borderGold.withValues(alpha: 0.2),
                  width: hasProduct ? 1.5 : 1,
                ),
                boxShadow: hasProduct && isActive
                    ? [
                        BoxShadow(
                          color: AppColors.green.withValues(alpha: 0.15),
                          blurRadius: 8,
                          spreadRadius: 1,
                        ),
                      ]
                    : null,
              ),
              child: isLocked
                  ? Center(
                      child: Icon(
                        AppIcons.lock,
                        color: AppFx.softOverlay(0.24),
                        size: AppIconSizes.medium,
                      ),
                    )
                  : hasProduct
                      ? CachedAssetImage(
                          fileName: slot!.product!.urunIconu,
                          fit: BoxFit.contain,
                        )
                      : Center(
                          child: Icon(
                            AppIcons.addCircleOutline,
                            color: AppColors.gold.withValues(alpha: 0.45),
                            size: AppIconSizes.medium,
                          ),
                        ),
            );
          }

'''
          marker = '  Widget _buildSmallBadge('
          if '  Widget _buildSlotsSection(MineListItemModel item)' not in m:
              idx = m.find(marker)
              if idx < 0:
                  raise SystemExit('mine small badge marker missing')
              m = m[:idx] + mine_slots + m[idx:]
          mine_path.write_text(m)

          # Detail composition: keep business logic intact, align visible hierarchy.
          fd = Path('lib/features/factory/ui/factory_detail_screen.dart')
          t = fd.read_text()
          t = t.replace("'Üretim Hatları',\n                        'Her üretim slotunun ürününü, kalitesini, markasını ve çalışma durumunu ayrı ayrı yönetebilirsin.'",
                        "'Üretim Slotları',\n                        'Her slotta ürünü, kaliteyi, markayı ve çalışma durumunu ayrı ayrı yönetebilirsin.'")
          old_value = "'${detail.outputInventories.isNotEmpty ? detail.outputInventories.first.quantity : 0}/${detail.factory.outputCapacity}'"
          t = t.replace(old_value, "'${detail.totalOutputQuantity}/${detail.factory.outputCapacity}'")
          old_ratio = "(detail.outputInventories.isNotEmpty\n                            ? detail.outputInventories.first.quantity\n                            : 0)\n                        .toDouble()"
          t = t.replace(old_ratio, 'detail.totalOutputQuantity.toDouble()')
          needle = "                      SizedBox(height: 12.h),\n                      _buildFactoryInventoryOverview(\n                        context,\n                        ref,\n                        detail,\n                      ),"
          repl = "                      SizedBox(height: 14.h),\n                      _buildSectionHeader(\n                        'Stok ve Akışlar',\n                        'Ortak hammadde ve ürün stoklarını, kapasiteyi ve transfer akışlarını buradan yönetebilirsin.',\n                        icon: AppIcons.inventory2Outlined,\n                        color: AppColors.blue,\n                      ),\n                      SizedBox(height: 10.h),\n                      _buildFactoryInventoryOverview(\n                        context,\n                        ref,\n                        detail,\n                      ),"
          if needle in t:
              t = t.replace(needle, repl, 1)
          fd.write_text(t)

          md = Path('lib/features/mine/ui/mine_detail_screen.dart')
          t = md.read_text()
          t = t.replace("'Her slotun kaynağını, kalitesini, markasını ve çalışma durumunu ayrı ayrı yönetebilirsin.'",
                        "'Her slotta kaynağı, kaliteyi, markayı ve çalışma durumunu ayrı ayrı yönetebilirsin.'")
          needle = "                      SizedBox(height: 12.h),\n                      _buildMineInventoryOverview(context, ref, detail),"
          repl = "                      SizedBox(height: 14.h),\n                      _buildSectionHeader(\n                        'Stok ve Akışlar',\n                        'Ortak ürün stoğunu, kapasiteyi ve transfer akışlarını buradan yönetebilirsin.',\n                        icon: AppIcons.inventory2Outlined,\n                        color: AppColors.blue,\n                      ),\n                      SizedBox(height: 10.h),\n                      _buildMineInventoryOverview(context, ref, detail),"
          if needle in t:
              t = t.replace(needle, repl, 1)
          md.write_text(t)
          PY

          dart format \
            lib/features/factory/ui/factory_screen.dart \
            lib/features/mine/ui/mine_screen.dart \
            lib/features/factory/ui/factory_detail_screen.dart \
            lib/features/mine/ui/mine_detail_screen.dart \
            lib/features/factory/ui/factory_multislot_section.dart \
            lib/features/mine/ui/mine_multislot_section.dart

