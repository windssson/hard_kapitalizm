name: Part 12 production UI unification

on:
  push:
    branches:
      - feat/unify-production-ui-part12

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/unify-production-ui-part12
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply UI patch
        run: python3 tool/part12_ui_patch.py

      - name: Format Dart
        run: |
          dart format \
            lib/features/factory/ui/factory_screen.dart \
            lib/features/mine/ui/mine_screen.dart \
            lib/features/factory/ui/factory_detail_screen.dart \
            lib/features/mine/ui/mine_detail_screen.dart \
            lib/features/factory/ui/factory_multislot_section.dart \
            lib/features/mine/ui/mine_multislot_section.dart

      - name: Remove temporary tooling
        run: |
          rm tool/part12_ui_patch.py
          rm .github/workflows/part12-unify-production-ui.yml

      - name: Commit UI unification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unify factory and mine UI with field farm patterns"
          git push origin HEAD:feat/unify-production-ui-part12
