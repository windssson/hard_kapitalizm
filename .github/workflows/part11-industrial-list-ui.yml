name: Part 11 industrial list UI patch

on:
  push:
    branches: [feat/frontend-industrial-list-multislot-part11]
    paths:
      - .github/workflows/part11-industrial-list-ui.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/frontend-industrial-list-multislot-part11
          fetch-depth: 0

      - name: Apply Factory/Mine multi-slot list UI patch
        run: python tool/part11_patch_industrial_lists.py

      - name: Remove temporary tooling
        run: rm -f tool/part11_patch_industrial_lists.py .github/workflows/part11-industrial-list-ui.yml

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Render industrial multi-slot summaries in list cards"
          git push origin HEAD:feat/frontend-industrial-list-multislot-part11
