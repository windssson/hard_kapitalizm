name: Part 10 slot payload market patch

on:
  push:
    branches: [feat/frontend-slot-payload-market-part10]
    paths:
      - .github/workflows/part10-slot-payload-market.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/frontend-slot-payload-market-part10
          fetch-depth: 0

      - name: Apply slot payload and market patch
        run: python tool/part10_patch_slot_payload_market.py

      - name: Remove temporary tooling
        run: rm -f tool/part10_patch_slot_payload_market.py .github/workflows/part10-slot-payload-market.yml

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Parse industrial slots and fix market production demand"
          git push origin HEAD:feat/frontend-slot-payload-market-part10
